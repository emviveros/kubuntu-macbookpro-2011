<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fontes do Antigravity (scripts/90-antigravity.sh). O app e a IDE trazem um
     fontconfig embutido mais novo que o do sistema e gravam o cache num formato
     que o sistema não lê (*.cache-11). Aqui o cache deles vai para uma pasta
     própria, ~/.cache/antigravity-fontconfig, e ~/.cache/fontconfig fica só
     com o formato do sistema. As fontes e regras são as do sistema. -->
<fontconfig>
  <cachedir prefix="xdg">antigravity-fontconfig</cachedir>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
</fontconfig>
