<touchégg>
  <!-- Gestos estilo macOS para o Touchégg 2.x (scripts/80-gestos.sh) -->

  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">20</property>
    <property name="color">auto</property>
    <property name="borderColor">auto</property>
  </settings>

  <application name="All">
    <!-- 3 dedos para cima: Mission Control (Visão geral) -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>qdbus org.kde.kglobalaccel /component/kwin invokeShortcut Overview</command>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>qdbus org.kde.kglobalaccel /component/kwin invokeShortcut Overview</command>
        <on>begin</on>
      </action>
    </gesture>

    <!-- 3 dedos para baixo: App Exposé (janelas do app atual) -->
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>qdbus org.kde.kglobalaccel /component/kwin invokeShortcut ExposeClass</command>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="4" direction="DOWN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>qdbus org.kde.kglobalaccel /component/kwin invokeShortcut ExposeClass</command>
        <on>begin</on>
      </action>
    </gesture>

    <!-- 3 dedos para os lados: trocar de área de trabalho (Spaces) -->
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="CHANGE_DESKTOP">
        <direction>next</direction>
        <animate>true</animate>
        <animationPosition>right</animationPosition>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="CHANGE_DESKTOP">
        <direction>previous</direction>
        <animate>true</animate>
        <animationPosition>left</animationPosition>
      </action>
    </gesture>

    <!-- 4 dedos em qualquer direção: igual ao de 3. O bcm5974 às vezes conta 3 dedos
         como 4, e sem isso a passada não faz nada. -->
    <gesture type="SWIPE" fingers="4" direction="LEFT">
      <action type="CHANGE_DESKTOP">
        <direction>next</direction>
        <animate>true</animate>
        <animationPosition>right</animationPosition>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="4" direction="RIGHT">
      <action type="CHANGE_DESKTOP">
        <direction>previous</direction>
        <animate>true</animate>
        <animationPosition>left</animationPosition>
      </action>
    </gesture>

    <!-- Pinça com 4 dedos: Launchpad (lançador de aplicativos) -->
    <gesture type="PINCH" fingers="4" direction="IN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>qdbus org.kde.plasmashell /PlasmaShell activateLauncherMenu</command>
        <on>begin</on>
      </action>
    </gesture>

    <!-- Abrir 4 dedos: mostrar a área de trabalho -->
    <gesture type="PINCH" fingers="4" direction="OUT">
      <action type="SHOW_DESKTOP">
        <animate>true</animate>
      </action>
    </gesture>
  </application>
</touchégg>
